<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Паролни киритиш</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #17212b);
            --text-color: var(--tg-theme-text-color, #f5f5f5);
            --card-bg: var(--tg-theme-secondary-bg-color, #242f3d);
            --btn-bg: var(--tg-theme-button-color, #2481cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #7f91a4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            width: 100%;
            max-width: 320px;
            background-color: var(--card-bg);
            padding: 24px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            text-align: center;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            font-size: 42px;
            margin-bottom: 12px;
            display: block;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--hint-color);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 24px;
            letter-spacing: 6px;
            text-align: center;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            user-select: auto;
            -webkit-user-select: auto;
        }

        input[type="password"]:focus {
            border-color: var(--btn-bg);
            box-shadow: 0 0 0 3px rgba(36, 129, 204, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: var(--btn-text);
            background-color: var(--btn-bg);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:active {
            opacity: 0.85;
            transform: scale(0.98);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">🔐</span>
        <h2>Кириш пароли</h2>
        <p class="subtitle">Паролни киритинг ва Тасдиқлаш тугмасини босинг</p>
        
        <form id="authForm" onsubmit="handleAuthSubmit(event)">
            <div class="input-group">
                <input 
                    type="password" 
                    id="passwordInput" 
                    placeholder="••••••" 
                    inputmode="numeric"
                    autocomplete="off" 
                    autofocus
                    required
                >
            </div>
            <button type="submit">
                <span>✅ Тасдиқлаш</span>
            </button>
        </form>
        <div id="errorMsg" class="error-msg">Пароль киритилмади!</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Форма юборилганда
        function handleAuthSubmit(e) {
            e.preventDefault();
            const pwd = document.getElementById('passwordInput').value.trim();
            if (pwd) {
                tg.sendData(pwd);
            } else {
                const err = document.getElementById('errorMsg');
                err.style.display = 'block';
            }
        }
    </script>
</body>
</html>
